strings:
  inputs:
    - ${WORKSPACE_DIR}/Projects/UIComponent/Resources/Localization/ko.lproj/Localizable.strings
  outputs:
    # macOS 27 에서 SwiftGen 6.6.3 이 templateName(번들 템플릿) 해석 중 크래시(Trace/BPT trap)하므로 파일 경로로 직접 지정
    - templatePath: ${WORKSPACE_DIR}/Tools/SwiftGen_SwiftGenCLI.bundle/Contents/Resources/templates/strings/structured-swift5.stencil
      output: ${WORKSPACE_DIR}/Projects/UIComponent/Sources/AutoGenerated/Strings.swift
      params:
        enumName: L10n
        publicAccess: true
